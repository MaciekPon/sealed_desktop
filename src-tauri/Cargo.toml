[package]
name = "sealed-desktop"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sealed_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-stronghold = "2.3.1"
tauri-plugin-notification = "2.3.3"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
curve25519-dalek = "5.0.0"
rand = "0.10.2"
thiserror = "2.0.19"
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.0"
aes-gcm = { version = "0.11.0", features = ["aes"] }
subtle = "2.6.1"
rand08 = { version = "0.8", package = "rand" }
pqc_kyber = { version = "0.7.1", default-features = false, features = ["kyber512", "benchmarking"] }
iota_stronghold = "2"
zeroize = "1.9.0"
argon2 = "0.5.3"
rusqlite = { version = "0.40.1", features = ["bundled", "serialize"] }
bip39 = { version = "2.2.2", features = ["rand"] }
rmp = "0.8.15"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "alloc"] }
base64 = "0.23.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "query"] }
url = "2.5.8"
flate2 = "1.1.5"
num-bigint = "0.4"
num-traits = "0.2"

