name: Build & Release

# Manual trigger by default — click "Run workflow" in the Actions tab
# whenever you want a fresh build for testers. Also runs on any pushed tag
# starting with "v" (e.g. `git tag v0.1.0 && git push origin v0.1.0`), if
# you'd rather cut a build that way.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# tauri-action needs write access to create the draft release + upload
# build assets. Explicit here rather than relying on the repo's
# Settings -> Actions -> General -> "Workflow permissions" default, which
# is read-only unless changed — this way it works regardless of that
# setting ("Resource not accessible by integration" is what a read-only
# GITHUB_TOKEN produces when tauri-action tries to create the release).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # macos-latest runners are Apple Silicon; build a universal
          # binary so both Apple Silicon and Intel testers can run it.
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts tauri-action generates (because
          # `bundle.createUpdaterArtifacts: true` in tauri.conf.json) and
          # publishes a `latest.json` manifest alongside the installers —
          # this is what `@tauri-apps/plugin-updater`'s configured endpoint
          # actually reads. Secrets set once in the repo's Settings ->
          # Secrets and variables -> Actions; see the private key file this
          # session generated (not committed anywhere) for the values.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Sealed v__VERSION__"
          releaseBody: |
            Unsigned build (no OS code-signing cert yet) — Windows will show
            a SmartScreen warning ("Windows protected your PC" → More info →
            Run anyway), macOS will block it via Gatekeeper the first time
            (right-click the app → Open, or System Settings → Privacy &
            Security → Open Anyway). This is expected until a code-signing
            certificate is set up. In-app auto-update is signed and will
            work regardless of this.
          releaseDraft: true
          # Not a prerelease: `plugins.updater.endpoints` in tauri.conf.json
          # points at GitHub's "latest release" API, which explicitly
          # excludes prereleases (and drafts) — leaving this `true` would
          # make the update endpoint never resolve to anything. Publishing
          # the draft (manual step, unchanged) is still the real gate.
          prerelease: false
          args: ${{ matrix.args }}
